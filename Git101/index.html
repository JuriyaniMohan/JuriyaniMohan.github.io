<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git Hub Basics to Advance</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #0a0f1e;
      color: #e0e6f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 2.6rem;
      color: #4fc3f7;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #90a4ae;
      margin-bottom: 30px;
      font-size: 1.1rem;
    }

    /* NAVBAR */
    .navbar {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-bottom: 25px;
    }

    .nav-link {
      color: #4fc3f7;
      text-decoration: none;
      font-size: 14px;
      border-bottom: 2px solid transparent;
      transition: 0.3s;
    }

    .nav-link:hover {
      border-bottom: 2px solid #4fc3f7;
    }

    /* CARD */
    .card {
      background: #131929;
      border: 1px solid #1e3a5f;
      border-radius: 14px;
      padding: 28px;
      margin-bottom: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
      text-align: left;
    }

    .card h2 {
      color: #4fc3f7;
      font-size: 1.2rem;
      margin-bottom: 16px;
    }

    /* BADGES */
    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .badge {
      background: #0d3b2e;
      color: #4caf96;
      border: 1px solid #4caf96;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      text-decoration: none;
      transition: 0.3s;
    }

    .badge:hover {
      background: #4caf96;
      color: #0a0f1e;
      transform: translateY(-2px);
    }

    /* STACK */
    .stack {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stack-item {
      background: #0d1a2e;
      border-radius: 8px;
      padding: 14px;
      transition: 0.3s;
    }

    .stack-item:hover {
      transform: scale(1.03);
    }

    .label {
      color: #90a4ae;
      font-size: 11px;
      text-transform: uppercase;
    }

    .value {
      color: #e0e6f0;
      font-size: 14px;
      margin-top: 4px;
    }

    /* GITHUB BOX */
    .github-box {
      width: 120px;
      height: 120px;
      border: 2px solid #333;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 20px;
      overflow: hidden;
      transition: 0.3s;
    }

    .github-box img {
      width: 60px;
      animation: move 2s infinite alternate ease-in-out;
    }

    @keyframes move {
      0% { transform: translateY(-10px); }
      100% { transform: translateY(10px); }
    }

    .github-box:hover {
      background-color: #f5f5f5;
      transform: scale(1.05);
    }

    footer {
      text-align: center;
      color: #455a6a;
      margin-top: 24px;
      font-size: 13px;
    }

    /* RESPONSIVE */
    @media (max-width: 600px) {
      .stack {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- GitHub Box -->
    <div class="github-box">
      <a href="https://github.com/your-username" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/25/25231.png" alt="GitHub">
      </a>
    </div>

    <h1>GIT</h1>
    <p class="subtitle">Git Hub Preparation</p>

    <!-- NAVBAR -->
    <div class="navbar">
      <a class="nav-link" href="../index.html">Home</a>
      <a class="nav-link">Projects</a>
      <a class="nav-link" href="../about.html">About</a>
    </div>

    <!-- DAYS SECTION -->
    <div class="card">
      <h2>📅 Sections</h2>
      <div class="badges">
        <a class="badge" href="git-training.html">Day 1 — Git Advanced</a>
        <a class="badge" href="git-vscode-guide.html">Day 1 — Git Workflow</a>
      </div>
    </div>

    <!-- STACK SECTION -->
    <div class="card">
      <h2>🛠️ Tech Stack</h2>

      <div class="stack">
        <div class="stack-item">
          <div class="label">Domain</div>
          <div class="value">GitHub</div>
        </div>

        <div class="stack-item">
          <div class="label">Repo Author</div>
          <div class="value">Mohan Juriyani</div>
        </div>

        <div class="stack-item">
          <div class="label">Hosting</div>
          <div class="value">GitHub Pages</div>
        </div>

        <!-- LinkedIn -->
        <div class="stack-item">
          <div class="label">Connect</div>
          <div class="value">
            <a href="https://linkedin.com/in/mohanjuriyani" target="_blank" style="display:flex; align-items:center; gap:8px; text-decoration:none; color:inherit;">
              <img src="https://cdn-icons-png.flaticon.com/512/174/174857.png" width="20">
              LinkedIn
            </a>
          </div>
        </div>

      </div>
    </div>

    <footer>
      © 2026 Mohan Juriyani | Cloud Infrastructure Engineer
    </footer>

  </div>

</body>
</html>
