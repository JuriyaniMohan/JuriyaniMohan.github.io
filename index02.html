<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi Cloud Learning Platform</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #0a0f1e;
      color: #e0e6f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      width: 100%;
    }

    h1 {
      font-size: 2.6rem;
      color: #4fc3f7;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #90a4ae;
      margin-bottom: 30px;
      font-size: 1.1rem;
    }

    /* NAVBAR */
    .navbar {
      display: flex;
      gap: 20px;
      margin-bottom: 25px;
    }

    .nav-link {
      color: #4fc3f7;
      text-decoration: none;
      font-size: 14px;
      border-bottom: 2px solid transparent;
      transition: 0.3s;
    }

    .nav-link:hover {
      border-bottom: 2px solid #4fc3f7;
    }

    /* CARD */
    .card {
      background: #131929;
      border: 1px solid #1e3a5f;
      border-radius: 14px;
      padding: 28px;
      margin-bottom: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }

    .card h2 {
      color: #4fc3f7;
      font-size: 1.2rem;
      margin-bottom: 16px;
    }

    /* BADGES */
    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .badge {
      background: #0d3b2e;
      color: #4caf96;
      border: 1px solid #4caf96;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      text-decoration: none;
      transition: 0.3s;
    }

    .badge:hover {
      background: #4caf96;
      color: #0a0f1e;
      transform: translateY(-2px);
    }

    /* STACK */
    .stack {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stack-item {
      background: #0d1a2e;
      border-radius: 8px;
      padding: 14px;
      transition: 0.3s;
    }

    .stack-item:hover {
      transform: scale(1.03);
    }

    .label {
      color: #90a4ae;
      font-size: 11px;
      text-transform: uppercase;
    }

    .value {
      color: #e0e6f0;
      font-size: 14px;
      margin-top: 4px;
    }

    footer {
      text-align: center;
      color: #455a6a;
      margin-top: 24px;
      font-size: 13px;
    }

    /* BLINKER */
    h1::before {
      content: '☁';
      color: #10b981;
      margin-right: 6px;
      animation: dots 1.5s steps(3, end) infinite;
    }
    @keyframes dots {
        0% { content: ''; }
        33% { content: '.'; }
        66% { content: '..'; }
        100% { content: '...'; }

    /* RESPONSIVE */
    @media (max-width: 600px) {
      .stack {
        grid-template-columns: 1fr;
      }
    }

  </style>

  <link rel="stylesheet" href="assets/modern-theme.css">
</head>

<body>

<h1 style="text-align: center;">Learning Guides</h1>
